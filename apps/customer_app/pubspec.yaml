name: foodie_birganj
description: >-
  Petuk / Foodie Birganj — Customer App (Phase 1 MVP). Hyperlocal food delivery
  for Birganj Pourashava, Dinajpur, Bangladesh. Built from the finalized SRS.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # State management — BLoC pattern (SRS §1).
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Networking — ready for the Phase 2 REST backend.
  dio: ^5.7.0

  # UI / media.
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Localization & formatting (Bangla digits, ৳ amounts).
  intl: ^0.20.2

  # Session persistence (OTP login survives app restarts).
  shared_preferences: ^2.3.3

  # Rider / support call button (SRS Order Tracking).
  url_launcher: ^6.3.1
  geolocator: ^14.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Bundled Bangla font so the UI renders instantly on 2G/3G with zero
  # network fetches (SRS NFR: home < 3s on slow networks). The family name
  # matches Google Fonts exactly, so `GoogleFonts.hindSiliguri()` resolves
  # to these bundled files instead of downloading at runtime.
  fonts:
    - family: Hind Siliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
